<!DOCTYPE html>
<html lang="en">
<head>
<title>Raul’s Record Collection – Vinyl and CD</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="author" content="Raul Mateos">
<meta name="keywords" content="rainbow, blackmore, metallica, iron maiden, dio, deep purple, led zeppelin, riot, ozzy osbourne, judas priest, EMI, polydor, records, collection, emi, singles, LP, bootleg, Japan, vinyl, rock, metal">
<meta name="description" content='My whole Vinyl and CD hard rock and heavy metal and related genres collection: Iron Maiden, Rainbow, Deep Purple, DIO, Judas Priest, Metallica...: 12", 7", Singles, LP, CD, Bootlegs'>
<meta name="robots" content="index, follow">
<meta name="revisit-after" content="45 days">
<link rel="stylesheet" href="styles/raul.css" type="text/css">
<link rel="stylesheet" href="styles/cookieconsent.css" type="text/css">
<style>.tablesorter, #up, #fil {opacity: 0.1;} .wr {color:#fff; text-align:right;}</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tablesort/5.2.1/tablesort.min.js"></script>
<script src="scripts/cookieconsent.js"></script>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-5CR6XYZPYE"></script>
<script src="scripts/g.js"></script>
</head>
<body>
<header id="toc">
<i id="nav-toggle" title="Menu"></i>
<h1>Raul’s Record (Vinyl and CD) Collection</h1>
<nav>
<ul id="nav">
	<li><a href="rainbow/all.html">Rainbow</a></li>
	<li><a href="iron_maiden/all.html">Iron Maiden</a></li>
	<li><a href="deep_purple.html">Deep Purple</a></li>
	<li><a href="black_sabbath.html">Black Sabbath</a></li>
	<li><a href="dio.html">DIO</a></li>
	<li><a href="vinyl.html">Vinyl Collection</a></li>
	<li><a href="CD.html">CD Collection</a></li>
</ul>
</nav>
</header>
<div id="msg">&nbsp;<span id="loading">Loading...</span></div>
<div id="fil"><i class="icon-search"></i><input name="filter" value="" maxlength="30" size="31" type="text"> &nbsp; <button id="clr">Clear search</button></div>
<div id="msg2">&nbsp;</div>
<table id="unified_table" class="tablesorter artist">
<thead><tr><th data-sort-default="asc">Artist</th><th>Title</th><th>Country & Year<br><span class="b">Bootlegs</span>: City & Date</th><th>Label & Catalog Number / Comments</th><th>Format</th></tr>
</thead>
<tbody></tbody>
</table>
<script>
document.addEventListener("DOMContentLoaded", () => {
const elements = {
	unifiedTbody: document.querySelector('#unified_table tbody'),
	tabla: document.getElementById('unified_table'),
	thead: document.querySelector('#unified_table thead'),
	input: document.querySelector('input'),
	filInput: document.querySelector('#fil input'),
	nav: document.getElementById('nav'),
	clr: document.getElementById('clr'),
	msg: document.getElementById('msg'),
	msg2: document.getElementById('msg2'),
	navt: document.getElementById('nav-toggle'),
	upElem: document.getElementById('up'),
	filContainer: document.getElementById('fil')
};
const navtcElements = [elements.navt, elements.nav];
const defaultTerms = [
	{searchTerm: '7"', label: '7" singles/EPs'},
	{searchTerm: '12"', label: '12" singles/EPs'},
	{searchTerm: 'LP', label: 'LPs/Mini LPs'},
	{searchTerm: 'CD', label: 'CDs'},
	{searchTerm: 'Box', label: 'Boxes'},
	{searchTerm: 'DVD', label: 'DVDs'}
];
const addRowsToUnifiedTable = async (artist, url, specific = false) => {
	const response = await fetch(url);
	const data = await response.text();
	const parser = new DOMParser();
	const doc = parser.parseFromString(data, 'text/html');
	const fragment = document.createDocumentFragment();
	doc.querySelectorAll('.tablesorter').forEach(table => {
		if (!specific) {
			const thead = table.querySelector('thead');
			if (thead) {
				const firstRow = thead.querySelector('tr');
				if (firstRow) {
					const th = document.createElement('th');
					th.textContent = 'Artist';
					firstRow.insertBefore(th, firstRow.firstChild);
				}
			}
		}
		table.querySelectorAll('tbody tr').forEach(tr => {
			if (!specific) {
				const td = document.createElement('td');
				td.textContent = artist.toUpperCase().replace(/_/g, ' ');
				tr.insertBefore(td, tr.firstChild);
			}
			const filename = url.split('/').pop();
			const section = table.closest('section');
			const isBootleg = filename === 'bootlegs.html' || 
						(section && ['Boots_Vin', 'Boots_CD'].includes(section.id));
			if (isBootleg) {
				const tds = tr.querySelectorAll('td');
				if (tds.length >= 4) {
					const td = tds[3];
					let currentContent = td.innerHTML.trim();
					const bootlegSpan = '<span class="b">Bootleg</span>';
					const wSpan = '<span class="w">. </span>';
					if (currentContent === '') {
						td.innerHTML = bootlegSpan;
					} else if (currentContent.endsWith('</span>')) {
						td.innerHTML = `${currentContent} ${bootlegSpan}`;
					} else {
						td.innerHTML = `${currentContent}${wSpan}${bootlegSpan}`;
					}
				}
			}
			fragment.appendChild(tr);
		});
	});
	elements.unifiedTbody.appendChild(fragment);
};
Promise.all([
	addRowsToUnifiedTable('vinyl', 'vinyl.html', true),
	addRowsToUnifiedTable('black_sabbath', 'black_sabbath.html'),
	addRowsToUnifiedTable('deep_purple', 'deep_purple.html'),
	addRowsToUnifiedTable('dio', 'dio.html'),
	addRowsToUnifiedTable('rainbow', 'rainbow/vinyl.html'),
	addRowsToUnifiedTable('rainbow', 'rainbow/CD.html'),
	addRowsToUnifiedTable('rainbow', 'rainbow/bootlegs.html'),
	addRowsToUnifiedTable('rainbow', 'rainbow/others.html'),
	addRowsToUnifiedTable('iron_maiden', 'iron_maiden/singles.html'),
	addRowsToUnifiedTable('iron_maiden', 'iron_maiden/LP.html'),
	addRowsToUnifiedTable('iron_maiden', 'iron_maiden/CD_singles.html'),
	addRowsToUnifiedTable('iron_maiden', 'iron_maiden/CD.html'),
	addRowsToUnifiedTable('iron_maiden', 'iron_maiden/cassette.html'),
	addRowsToUnifiedTable('iron_maiden', 'iron_maiden/bootlegs.html'),
	addRowsToUnifiedTable('CD', 'CD.html', true)
]).then(() => {
	const rows = Array.from(elements.tabla.querySelectorAll('tbody tr'));
	new Tablesort(elements.tabla);
	rows.forEach(tr => {
		tr.querySelector('td:first-child')?.classList.add('bo');
		tr.querySelector('td:nth-child(3)')?.classList.add('n');
		tr.querySelector('td:nth-child(4)')?.classList.add('c');
	});
	if (elements.navt) {
		elements.navt.addEventListener('click', () => 
			navtcElements.forEach(el => el.classList.toggle('collapsed'))
		);
	}
	document.addEventListener('keyup', evt => {
		if (evt.key === 'Escape' && elements.nav?.classList.contains('collapsed')) {
			navtcElements.forEach(el => el.classList.toggle('collapsed'));
		}
	});
	const getRecordInfo = () => {
		const counts = defaultTerms.map(({searchTerm, label}) => {
			const count = rows.filter(row => 
				row.style.display !== 'none' && 
				row.querySelector('td:nth-child(5)')?.textContent?.includes(searchTerm)
			).length;
			return `${label}: <span class="c">${count}</span>`;
		}).join('; ');
		return `(${counts})`;
	};
	elements.msg.innerHTML = `
		Total Records: <span class="bo">${rows.length}</span>
		${getRecordInfo()}. The dates of <span class="b">bootlegs</span> are DD/MM/YY.
		Record collection updated March 2025.
	`;
	elements.filInput.addEventListener('keyup', function() {
		const searchTerms = this.value.toLowerCase().split(/\s+/).filter(Boolean);
		rows.forEach(row => {
			const text = row.textContent.toLowerCase();
			row.style.display = searchTerms.every(term => text.includes(term)) ? '' : 'none';
		});
		const visibleCount = rows.filter(row => row.style.display !== 'none').length;
		elements.thead.style.display = visibleCount ? '' : 'none';
		elements.tabla.style.display = visibleCount ? '' : 'none';
		elements.msg2.innerHTML = visibleCount 
			? `<span class="bo">${visibleCount}</span> record(s) found ${getRecordInfo()}` 
			: 'No records found';
	});
	elements.clr.addEventListener('click', () => {
		elements.filInput.value = '';
		rows.forEach(row => row.style.display = '');
		elements.filInput.dispatchEvent(new KeyboardEvent('keyup'));
		if (elements.msg2) elements.msg2.innerHTML = '&nbsp;';
		if (elements.thead) elements.thead.style.display = '';
		elements.tabla.style.display = '';
	});
	elements.input.placeholder = `Type here to search in the ${rows.length} items`;
	[elements.upElem, elements.tabla, elements.filContainer].forEach(el => {if (el) el.style.opacity = '1';});
	document.body.style.cursor = 'default';
});
});
</script>
<div id="up"><a href="#toc">Go Up</a>&nbsp; </div>
</body></html>
