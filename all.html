<!DOCTYPE html>
<html lang="en">
<head>
<title>Raul’s Record Collection – Vinyl and CD</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="author" content="Raul Mateos">
<meta name="keywords" content="rainbow, blackmore, metallica, iron maiden, dio, deep purple, led zeppelin, riot, ozzy osbourne, judas priest, EMI, polydor, records, collection, singles, LP, bootleg, Japan, vinyl, rock, metal">
<meta name="description" content="Raul's hard rock and heavy metal collection featuring vinyl records, CDs, and bootlegs">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://www.raulmateos.com/">
<link rel="icon" href="favicon.ico">
<link rel="stylesheet" href="styles/raul.css" type="text/css">
<link rel="stylesheet" href="styles/cookieconsent.css" type="text/css">
<style>.tablesorter, #up, #fil {opacity: 0.1;} .wr {color:#fff; text-align:right;}</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tablesort/5.2.1/tablesort.min.js"></script>
<script src="scripts/cookieconsent.js"></script>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-5CR6XYZPYE"></script>
<script src="scripts/g.js"></script>
</head>
<body>
<header id="toc">
<i id="nav-toggle" title="Menu"></i>
<h1>Raul’s Record (Vinyl and CD) Collection</h1>
<nav>
<ul id="nav">
	<li><a href="rainbow/all.html">Rainbow</a></li>
	<li><a href="iron_maiden/all.html">Iron Maiden</a></li>
	<li><a href="deep_purple.html">Deep Purple</a></li>
	<li><a href="black_sabbath.html">Black Sabbath</a></li>
	<li><a href="dio.html">DIO</a></li>
	<li><a href="vinyl.html">Vinyl Collection</a></li>
	<li><a href="CD.html">CD Collection</a></li>
</ul>
</nav>
</header>
<div id="msg">&nbsp;<span id="loading">Loading...</span></div>
<div id="fil"><i class="icon-search"></i><input name="filter" value="" maxlength="30" size="31" type="text"> &nbsp; <button id="clr">Clear search</button></div>
<div id="msg2">&nbsp;</div>
<table id="unified_table" class="tablesorter artist">
<thead><tr><th data-sort-default="asc">Artist</th><th>Title</th><th>Country &amp; Year<br><span class="b">Bootlegs</span>: City & Date</th><th>Label &amp; Catalog Number / Comments</th><th>Format</th></tr>
</thead>
<tbody></tbody>
</table>
<script>
document.addEventListener("DOMContentLoaded", () => {
const cached = {
	unifiedTbody: document.querySelector('#unified_table tbody'),
	thead: document.querySelector('#unified_table thead'),
	input: document.querySelector('input'),
	tabla: document.getElementById('unified_table'),
	nav: document.getElementById('nav'),
	navt: document.getElementById('nav-toggle'),
	clr: document.getElementById('clr'),
	msg: document.getElementById('msg'),
	msg2: document.getElementById('msg2'),
	up: document.getElementById('up'),
	fil: document.getElementById('fil'),
	rows: null
};
const navtb = [cached.nav, cached.navt];
const defaultTerms = [
	{searchTerm: '7"', label: '7" singles/EPs'},
	{searchTerm: '12"', label: '12" singles/EPs'},
	{searchTerm: 'LP', label: 'LPs/Mini LPs'},
	{searchTerm: 'CD', label: 'CDs'},
	{searchTerm: 'Box', label: 'Boxes'},
	{searchTerm: 'DVD', label: 'DVDs'}
];
const addRowsToUnifiedTable = async (artist, url, specific = false) => {
	const response = await fetch(url);
	const data = await response.text();
	const parser = new DOMParser();
	const doc = parser.parseFromString(data, 'text/html');
	const fragment = document.createDocumentFragment();
	const isRainbow = url.includes('rainbow/');
	const isIronMaiden = url.includes('iron_maiden/');
	const artistColumnText = !specific ? artist.toUpperCase().replace(/_/g, ' ') : null;
	doc.querySelectorAll('.tablesorter tbody tr').forEach(tr => {
		if (!specific) {
			const td = document.createElement('td');
			td.textContent = artistColumnText;
			tr.insertBefore(td, tr.firstChild);
		}
		const section = tr.closest('section');
		const isBootleg = url.includes('bootlegs.html') || section?.id?.startsWith('Boots_');
		if (isBootleg) {
			const tdFormat = tr.querySelector('td:nth-child(4)');
			const hasContent = tdFormat.innerHTML.trim().length > 0;
			const html = `${hasContent ? '<span class="w">. </span>' : ''}<span class="b">Bootleg</span>`;
			tdFormat.insertAdjacentHTML('beforeend', html);
			}
		if (isRainbow || isIronMaiden) {
			tr.querySelectorAll('a[href^="los_tengo/"]').forEach(a => {
				const originalHref = a.getAttribute('href');
				a.href = `${artist}/${originalHref}`;
			});
		}
		fragment.appendChild(tr);
	});
	cached.unifiedTbody.appendChild(fragment);
};
Promise.allSettled([
	addRowsToUnifiedTable('vinyl', 'vinyl.html', true),
	addRowsToUnifiedTable('black_sabbath', 'black_sabbath.html'),
	addRowsToUnifiedTable('deep_purple', 'deep_purple.html'),
	addRowsToUnifiedTable('dio', 'dio.html'),
	addRowsToUnifiedTable('rainbow', 'rainbow/vinyl.html'),
	addRowsToUnifiedTable('rainbow', 'rainbow/CD.html'),
	addRowsToUnifiedTable('rainbow', 'rainbow/bootlegs.html'),
	addRowsToUnifiedTable('rainbow', 'rainbow/others.html'),
	addRowsToUnifiedTable('iron_maiden', 'iron_maiden/singles.html'),
	addRowsToUnifiedTable('iron_maiden', 'iron_maiden/LP.html'),
	addRowsToUnifiedTable('iron_maiden', 'iron_maiden/CD_singles.html'),
	addRowsToUnifiedTable('iron_maiden', 'iron_maiden/CD.html'),
	addRowsToUnifiedTable('iron_maiden', 'iron_maiden/cassette.html'),
	addRowsToUnifiedTable('iron_maiden', 'iron_maiden/bootlegs.html'),
	addRowsToUnifiedTable('CD', 'CD.html', true)
]).then(() => {
	cached.rows = Array.from(cached.tabla.querySelectorAll('tbody tr'));
	cached.rows.forEach(tr => {
		tr.cells[0].classList.add('bo');
		tr.cells[2].classList.add('n');
		tr.cells[3].classList.add('c');
		tr._formatCell = tr.cells[4];
		tr._searchText = tr.textContent.toLowerCase();
	});
	const totalRecords = cached.rows.length;
	new Tablesort(cached.tabla);
	if (cached.navt) {cached.navt.addEventListener('click', () => navtb.forEach(el => el.classList.toggle('collapsed')));}
	document.addEventListener('keyup', evt => {
		if (evt.key === 'Escape' && cached.nav?.classList.contains('collapsed')) {navtb.forEach(el => el.classList.toggle('collapsed'));}
	});
	const getRecordInfo = () => {
		const visibleRows = cached.rows.filter(row => !row.hidden);
		const info = defaultTerms.map(({searchTerm, label}) => {
			const count = visibleRows.filter(row => row._formatCell.textContent.includes(searchTerm)).length;
			return `${label}: <span class="c">${count}</span>`;
		}).join('; ');
		return `(${info})`;
	};
	cached.msg.innerHTML = `<span class="bo">${totalRecords}</span> records ${getRecordInfo()}. The dates on <span class="b">bootlegs</span> use the day/month/year (DD/MM/YY) format. ${collectionUpdateNote}`;
	const updateUI = () => {
		const visibleCount = cached.rows.filter(row => !row.hidden).length;
		[cached.thead, cached.tabla].forEach(el => el.hidden = !visibleCount);
		cached.msg2.innerHTML = visibleCount ? `<span class="bo">${visibleCount}</span> record(s) found ${getRecordInfo()}` : 'No records found';
	};
	cached.input.addEventListener('keyup', function() {
		const searchText = this.value.toLowerCase().trim();
		if (!searchText) {cached.rows.forEach(row => row.hidden = false);} 
		else {
			const regex = new RegExp(searchText.split(/\s+/).map(term => `(?=.*${term})`).join(''), 'i');
			cached.rows.forEach(row => {row.hidden = !regex.test(row._searchText);});
		}
		updateUI();
	});
	cached.clr.addEventListener('click', () => {
		cached.tabla.hidden = false;
		cached.rows.forEach(row => row.hidden = false);
		updateUI();
		cached.msg2.innerHTML = '&nbsp;';
		cached.input.value = '';
		cached.input.focus();
	});
	cached.input.placeholder = `Type here to search in the ${totalRecords} items`;
	[cached.up, cached.tabla, cached.fil].forEach(el => {if (el) el.style.opacity = '1';})
	document.body.style.cursor = 'default';
});
});
</script>
<div id="up"><a href="#toc">Go Up</a>&nbsp; </div>
</body></html>
