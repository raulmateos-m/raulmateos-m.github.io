<body>

<nav>
<ul id="nav">

<div id="msg">
	<span id="loading">Loading...</span>
	<div id="progress-bar"><div id="progress-fill" style="width:0%"></div></div>
	<div id="progress-text">Loading data...</div>
</div>
<div id="fil"><i class="icon-search"></i><input name="filter" value="" maxlength="30" size="31" type="text"><button id="clr">Clear search</button></div>
<div id="msg2"></div>
<table id="unified_table" class="tablesorter artist">
<thead><tr><th data-sort-default="asc">Artist</th><th>Title</th><th>Country &amp; Year<br><span class="b">Bootlegs</span>: City & Date</th><th>Label &amp; Catalog Number / Comments</th><th>Format</th></tr>
</thead>
<tbody></tbody>
</table>
<script>
document.addEventListener("DOMContentLoaded", () => {
const cached = {
	unifiedTbody: document.querySelector('#unified_table tbody'),
	thead: document.querySelector('#unified_table thead'),
	input: document.querySelector('input'),
	tabla: document.getElementById('unified_table'),
	nav: document.getElementById('nav'),
	navt: document.getElementById('nav-toggle'),
	clr: document.getElementById('clr'),
	msg: document.getElementById('msg'),
	msg2: document.getElementById('msg2'),
	up: document.getElementById('up'),
	fil: document.getElementById('fil'),
	progressFill: document.getElementById('progress-fill'),
	progressText: document.getElementById('progress-text'),
	rows: null
};
const navtb = [cached.nav, cached.navt];
const formats = [
	{format: '7"', label: '7" singles/EPs'},
	{format: '12"', label: '12" singles/EPs'},
	{format: 'LP', label: 'LPs'},
	{format: 'CD', label: 'CDs'},
	{format: 'Box', label: 'Boxes'},
	{format: 'DVD', label: 'DVDs'}
];
const sources = [
	['vinyl','vinyl.html',true],
	['black_sabbath','black_sabbath.html'],
	['deep_purple','deep_purple.html'],
	['dio','dio.html'],
	...['vinyl','CD','bootlegs','others']
	  .map(page => ['rainbow', `rainbow/${page}.html`]),
	...['singles','LP','CD_singles','CD','cassette','bootlegs']
	  .map(page => ['iron_maiden', `iron_maiden/${page}.html`]),
	['CD','CD.html',true]
];
const loadingProgress = {total:sources.length, completed:0, totalRows:0};
function updateProgress(message = null) {
	const percentage = Math.round((loadingProgress.completed / loadingProgress.total) * 100);
	cached.progressFill.style.width = percentage + '%';
	if (message) {
		cached.progressText.textContent = message;
	} else {
		cached.progressText.textContent = `Loading file ${loadingProgress.completed}/${loadingProgress.total} (${percentage}%)`;
	}
}
const addRowsToUnifiedTable = async(artist, url, specific = false) => {
	const response = await fetch(url);
	const data = await response.text();
	const parser = new DOMParser();
	const doc = parser.parseFromString(data, 'text/html');
	const fragment = document.createDocumentFragment();
	const includes = {
		rainbow: url.includes('rainbow/'),
		ironMaiden: url.includes('iron_maiden/'),
		bootlegs: url.includes('bootlegs.html'),
	};
	const artistColumnText = !specific ? artist.toUpperCase().replace(/_/g, ' ') : null;
	const bootlegTag = '<span class="b">Bootleg</span>';
	const bootlegTagWithSeparator = '<span class="w">. </span><span class="b">Bootleg</span>';
	const rows = Array.from(doc.querySelectorAll('.tablesorter tbody tr'));
	updateProgress(`Loading...`);
	loadingProgress.totalRows += rows.length;
	rows.forEach(tr => {
		if (!specific) {
			const tdArtist = document.createElement('td');
			tdArtist.textContent = artistColumnText;
			tr.insertBefore(tdArtist, tr.firstChild);
		}
		const isBootleg = includes.bootlegs || tr.closest('section')?.id?.startsWith('Boots_');
		if (isBootleg) {
			const tdFormat = tr.querySelector('td:nth-child(4)');
			if (tdFormat) {
				const sep = tdFormat.innerHTML.trim() ? bootlegTagWithSeparator : bootlegTag;
				tdFormat.insertAdjacentHTML('beforeend', sep);
			}
		}
		if (includes.rainbow || includes.ironMaiden) {
			tr.querySelectorAll('a[href^="los_tengo/"]').forEach(a => {
				a.href = `${artist}/${a.getAttribute('href')}`;
			});
		}
	});
	fragment.append(...rows);
	cached.unifiedTbody.appendChild(fragment);
	loadingProgress.completed++;
	updateProgress();
};
function toggleNav() {navtb.forEach(el => el.classList.toggle('collapsed'));}

Promise.allSettled(
	sources.map(([artist, url, specific = false]) => addRowsToUnifiedTable(artist, url, specific))
).then(() => {
	cached.tabla.classList.add('is-root-cd-vinyl');
	cached.rows = Array.from(cached.tabla.tBodies[0].rows);
	cached.rows.forEach(tr => {
		tr._formatCell = tr.cells[4].textContent;
		tr._searchText = tr.textContent.toLowerCase();
	});
	const totalRecords = cached.rows.length;
	new Tablesort(cached.tabla);
	updateProgress('Loading table...');
	function getRecordInfo(visibleRows) {
		return `(${formats.map(({format, label}) => {
			const count = visibleRows.filter(row => row._formatCell.includes(format)).length;
			return `${label}: <span class="c">${count}</span>`;
		}).join('; ')})`
	}
	function applyFilter(searchTerms) {
		let visibleRows = [];
		for (let row of cached.rows) {
			const match = searchTerms.every(term => row._searchText.includes(term));
			row.hidden = !match;
			if (match) visibleRows.push(row);
		}
		return visibleRows;
	}
	function updateUI(visibleRows, isReset = false) {
		const visibleCount = visibleRows.length;
		cached.thead.hidden = cached.tabla.hidden = !visibleCount;
		cached.msg2.innerHTML = isReset ? '' : (
			visibleCount
			? `<span class="bo">${visibleCount}</span> ${visibleCount === 1 ? 'record' : 'records'} found ${getRecordInfo(visibleRows)}`
			: 'No records found'
		);
	}
	function init() {
		cached.msg.innerHTML = `<span class="bo">${totalRecords}</span> records ${getRecordInfo(cached.rows)}. The dates on <span class="b">bootlegs</span> use the day/month/year (DD/MM/YY) format. ${collectionUpdateNote}`;
		cached.input.placeholder = `Type here to search in the ${totalRecords} items`;
		[cached.up, cached.tabla, cached.fil].forEach(el => {if (el) el.style.opacity = '1';});
		document.body.style.cursor = 'default';
	}
	function setupEventListeners() {
		cached.input.addEventListener('input', function() {
			const searchTerms = this.value.toLowerCase().trim().split(/\s+/).filter(Boolean);
			if (searchTerms.length === 0) {
				cached.clr.click();
			} else {
				visibleRows = applyFilter(searchTerms);
				updateUI(visibleRows);
			}
		});
		cached.clr.addEventListener('click', () => {
			cached.input.value = '';
			cached.input.focus();
			const visibleRows = applyFilter([]);
			updateUI(visibleRows, true);
		});
		cached.navt?.addEventListener('click', () => toggleNav());
		document.addEventListener('keyup', (evt) => {
			if (evt.key === 'Escape' && cached.nav.classList.contains('collapsed')) {toggleNav();}
		});
	}
	init();
	setupEventListeners();
});
});
</script>
