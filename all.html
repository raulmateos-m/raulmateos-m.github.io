<!DOCTYPE html>
<html lang="en">
<head>
<title>Raul’s Record Collection – Vinyl and CD</title>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="Raul Mateos">
<meta name="keywords" content="rainbow, blackmore, metallica, iron maiden, dio, deep purple, led zeppelin, riot, ozzy osbourne, judas priest, EMI, polydor, records, collection, emi, singles, LP, bootleg, Japan, vinyl, rock, metal">
<meta name="description" content='My whole Vinyl and CD hard rock and heavy metal and related genres collection: Iron Maiden, Rainbow, Deep Purple, DIO, Judas Priest, Metallica...: 12", 7", Singles, LP, CD, Bootlegs'>
<meta name="robots" content="index, follow">
<meta name="revisit-after" content="45 days">
<link rel="stylesheet" href="styles/raul.css" type="text/css">
<style>.tablesorter, #up, #fil {opacity: 0.1;} .wr {color:#fff; text-align:right;}</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tablesort/5.2.1/tablesort.min.js"></script>
</head>
<body>
<header id="toc">
<i id="nav-toggle" title="Menu"></i>
<h1>Raul’s Record (Vinyl and CD) Collection</h1>
<nav>
<ul id="nav">
	<li><a href="rainbow/vinyl.html">Rainbow (Dio)</a></li>
	<li><a href="iron_maiden/singles.html">Iron Maiden</a></li>
	<li><a href="deep_purple.html">Deep Purple</a></li>
	<li><a href="black_sabbath.html">Black Sabbath</a></li>
	<li><a href="dio.html">DIO</a></li>
	<li><a href="vinyl.html">Vinyl Collection</a></li>
	<li><a href="CD.html">CD Collection</a></li>
</ul>
</header>
<div id="msg">&nbsp;<span id="loading">Loading...</span></div>
<div id="fil"><i class="icon-search"></i><input name="filter" value="" maxlength="30" size="31" type="text"> &nbsp; <button id="clr">Clear search</button></div>
<div id="msg2">&nbsp;</div>
<table id="unified_table" class="tablesorter artist">
<thead><tr><th>Artist</th><th>Title</th><th>Country &amp; Year<br><span class="b">Bootlegs</span>: City & Date</th><th>Label &amp; Catalog Number / Comments</th><th>Format</th></tr>
</thead>
<tbody></tbody>
</table>
<script>
document.addEventListener("DOMContentLoaded", function() {
	const unifiedTbody = document.querySelector('#unified_table tbody');
	const tabla = document.getElementById('unified_table');
	const input = document.querySelector('input');
	const filInput = document.querySelector('#fil input');
	const nav = document.getElementById('nav');
	const clr = document.getElementById('clr');
	const msg = document.getElementById('msg');
	const msg2 = document.getElementById('msg2');
	const navt = document.getElementById('nav-toggle');
	const upElem = document.getElementById('up');
	const filContainer = document.getElementById('fil');
	const navtcElements = [navt, nav];
	const defaultTerms = [
		{searchTerm: '7"', label: '7" singles/EPs'},
		{searchTerm: '12"', label: '12" singles/EPs'},
		{searchTerm: 'LP', label: 'LPs/Mini LPs'},
		{searchTerm: 'CD', label: 'CDs'},
		{searchTerm: 'Box', label: 'Boxes'},
		{searchTerm: 'DVD', label: 'DVDs'}
	];
	function addRowsToUnifiedTable(artist, url, specific = false) {
		return fetch(url)
			.then(response => response.text())
			.then(data => {
				const tempDiv = document.createElement('div');
				tempDiv.innerHTML = data;
				const loadedTables = tempDiv.querySelectorAll('.tablesorter');
				loadedTables.forEach(table => {
					const thead = table.querySelector('thead');
					const tbody = table.querySelector('tbody');
					if (thead && !specific) {
						const firstRow = thead.querySelector('tr');
						if (firstRow) {
							const th = document.createElement('th');
							th.textContent = 'Artist';
							firstRow.insertBefore(th, firstRow.firstChild);
						}
					}
					if (tbody) {
						tbody.querySelectorAll('tr').forEach(tr => {
							if (!specific) {
								const td = document.createElement('td');
								td.textContent = artist.toUpperCase();
								tr.insertBefore(td, tr.firstChild);
							}
							const filename = url.split('/').pop();
							let addBootlegLabel = false;
							if (filename === 'bootlegs.html') {
								addBootlegLabel = true;
							} else {
								const section = table.closest('section');
								if (section) {
									const sectionId = section.id;
									if (sectionId === 'Boots_Vin' || sectionId === 'Boots_CD') {
										addBootlegLabel = true;
									}
								}
							}
							if (addBootlegLabel) {
								const tds = tr.querySelectorAll('td');
								if (tds.length >= 4) {
									const td = tds[3];
									let currentContent = td.innerHTML.trim();
									const bootlegSpan = '<span class="b">Bootleg</span>';
									const wSpan = '<w>. </w>';
									if (currentContent === '') {
										td.innerHTML = bootlegSpan;
									} else if (currentContent.endsWith('</w>')) {
										td.innerHTML = currentContent.replace(/<\/w>$/, '. </w>') + ' ' + bootlegSpan;
									} else {
										td.innerHTML = currentContent + wSpan + bootlegSpan;
									}
								}
							}
							unifiedTbody.appendChild(tr);
						});
					}
				});
			});
	}
	Promise.all([
		addRowsToUnifiedTable('vinyl', 'vinyl.html', true),
		addRowsToUnifiedTable('black_sabbath', 'black_sabbath.html', false),
		addRowsToUnifiedTable('deep_purple', 'deep_purple.html', false),
		addRowsToUnifiedTable('dio', 'dio.html', false),
		addRowsToUnifiedTable('rainbow', 'rainbow/vinyl.html', false),
		addRowsToUnifiedTable('rainbow', 'rainbow/CD.html', false),
		addRowsToUnifiedTable('rainbow', 'rainbow/bootlegs.html', false),
		addRowsToUnifiedTable('rainbow', 'rainbow/others.html', false),
		addRowsToUnifiedTable('iron_maiden', 'iron_maiden/singles.html', false),
		addRowsToUnifiedTable('iron_maiden', 'iron_maiden/LP.html', false),
		addRowsToUnifiedTable('iron_maiden', 'iron_maiden/CD_singles.html', false),
		addRowsToUnifiedTable('iron_maiden', 'iron_maiden/CD.html', false),
		addRowsToUnifiedTable('iron_maiden', 'iron_maiden/cassette.html', false),
		addRowsToUnifiedTable('iron_maiden', 'iron_maiden/bootlegs.html', false),
		addRowsToUnifiedTable('CD', 'CD.html', true)
	]).then(() => {
		const totalRows = tabla.querySelectorAll('tbody tr');
		const totalRecords = totalRows.length;
		const tableSorterInstance = new Tablesort(tabla);
		if (navt) {
			navt.addEventListener('click', () => {
				navtcElements.forEach(el => el.classList.toggle('collapsed'));
			});
		}
		document.addEventListener('keyup', evt => {
			if (evt.key === 'Escape' && nav && nav.classList.contains('collapsed')) {
				navtcElements.forEach(el => el.classList.toggle('collapsed'));
			}
		});
		function getRecordInfo(currentTable) {
			const rows = currentTable.querySelectorAll('tbody tr');
			const result = defaultTerms.map(({ searchTerm, label }) => {
				let count = 0;
				rows.forEach(row => {
					if (row.style.display !== 'none') {
						const cells = row.querySelectorAll('td');
						if (cells.length >= 5) {
							const cellText = cells[4].textContent;
							if (cellText.includes(searchTerm)) {
								count++;
							}
						}
					}
				});
				return `${label}: <span class="c">${count}</span>`;
			}).join('; ');
			return `(${result})`;
		}
		if (msg) {
			msg.innerHTML =
				`Total Records: <span class="bo">${totalRecords}</span> ` +
				`${getRecordInfo(tabla)}. The dates of <span class="b">bootlegs</span> are DD/MM/YY.`;
		}
		if (filInput) {
			filInput.addEventListener('keyup', function() {
				const filterValue = this.value.toLowerCase();
				const searchTerms = filterValue.split(' ').filter(term => term !== '');
				const rows = tabla.querySelectorAll('tbody tr');
				rows.forEach(row => {
					const textContent = row.textContent.toLowerCase();
					const allTermsFound = searchTerms.every(term => textContent.includes(term));
					row.style.display = allTermsFound ? '' : 'none';
				});
				const thead = tabla.querySelector('thead');
				if (thead) {
					thead.style.display = '';
				}
				tabla.style.display = '';
				const visibleRows = Array.from(rows).filter(row => row.style.display !== 'none');
				const recordInfo = getRecordInfo(tabla);
				const msg2Text = visibleRows.length === 0
					? 'No records found'
					: `<span class="bo">${visibleRows.length}</span> record(s) found ${recordInfo}`;
				if (msg2) {
					msg2.innerHTML = msg2Text;
				}
				if (visibleRows.length === 0 && thead) {
					thead.style.display = 'none';
					tabla.style.display = 'none';
				}
			});
		}
		tabla.querySelectorAll('td:first-child').forEach(td => td.classList.add('bo'));
		tabla.querySelectorAll('td:nth-child(3)').forEach(td => td.classList.add('n'));
		tabla.querySelectorAll('td:nth-child(4)').forEach(td => td.classList.add('c'));
		tabla.querySelectorAll('tr:nth-child(odd)').forEach(tr => tr.classList.add('even'));
		if (input) {
			input.setAttribute("placeholder", `Type here to search in the ${totalRows.length} items`);
		}
		if (clr) {
			clr.addEventListener('click', function() {
				if (input) {
					input.value = '';
					input.focus();
					const event = new KeyboardEvent('keyup', { key: 'Backspace', code: 'Backspace', keyCode: 8, bubbles: true });
					input.dispatchEvent(event);
				}
				if (msg2) msg2.innerHTML = '&nbsp;';
			});
		}
		function replaceElement(selector, className) {
			const elements = document.querySelectorAll(selector);
			elements.forEach(element => {
				const span = document.createElement('span');
				span.className = className;
				span.textContent = element.textContent;
				if (className === 'c') {
					span.insertAdjacentText('beforeend', '; ');
				}
				element.replaceWith(span);
			});
		}
		replaceElement('c', 'c');
		replaceElement('w', 'w');
		if (upElem) {
			upElem.style.opacity = '1';
		}
		if (tabla) {
			tabla.style.opacity = '1';
		}
		if (filContainer) {
			filContainer.style.opacity = '1';
		}
		document.querySelectorAll('.s').forEach(element => {
			element.insertAdjacentHTML('beforeend', '<a href="#toc"> <i class="icon-long-arrow-up"></i></a>');
		});
		if (upElem) {
			upElem.insertAdjacentHTML('afterbegin', '<a href="#toc">Go Up</a>&nbsp;');
		}
		document.body.style.cursor = 'default';
	});
});
</script>
<div id="up"></div>
</body></html>
