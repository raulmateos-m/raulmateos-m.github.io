<!DOCTYPE html>
<html lang="en">
<head>
<title>Raul's Iron Maiden Record Collection</title>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="Raul Mateos">
<meta name="keywords" content="iron maiden, record, collection, CD, vinyl, single, LP, bootlegs, EMI, Japan, harris, dickinson, dianno, Discography">
<meta name="description" content="Iron Maiden record collection: Singles, LP, CD, DVD, Bootlegs and so on">
<meta name="robots" content="index, follow">
<meta name="revisit-after" content="1500 days">
<link rel="icon" href="../icons/ironmaiden.ico">
<link rel="stylesheet" href="../styles/raul.css" type="text/css">
<link rel="stylesheet" href="../styles/cookieconsent.css" type="text/css">
<style>.tablesorter, #up, #fil {opacity: 0.1;} .wr {color:#fff; text-align:right;} li#page::after {content:"";}</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tablesort/5.2.1/tablesort.min.js"></script>
</head>
<body>
<header id="toc">
<i id="nav-toggle" title="Menu"></i>
<h1>Iron Maiden Collection</h1>
<nav>
<ul id="nav">
	<li><a href="../all.html">All</a></li>
	<li><a href="../rainbow/all.html">Rainbow</a></li>
	<li id="page">Iron Maiden</li>
	<li><a href="../deep_purple.html">Deep Purple</a></li>
	<li><a href="../black_sabbath.html">Black Sabbath</a></li>
	<li><a href="../dio.html">DIO</a></li>
	<li><a href="../vinyl.html">Vinyl Collection</a></li>
	<li><a href="../CD.html">CD Collection</a></li>
</ul>
</nav>
</header>
<div id="msg">&nbsp;<span id="loading">Loading...</span></div>
<div id="fil"><i class="icon-search"></i><input name="filter" value="" maxlength="30" size="31" type="text"> &nbsp; <button id="clr">Clear search</button></div>
<div id="msg2">&nbsp;</div>
<table id="unified_table" class="tablesorter">
<thead><tr><th>Title</th><th>Country &amp; Year<br><span class="b">Bootlegs</span>: City & Date</th><th>Label &amp; Catalog Number / Comments</th><th>Format</th></tr>
</thead>
<tbody></tbody>
</table>
<script>
document.addEventListener("DOMContentLoaded", () => {
const elements = {
	unifiedTbody: document.querySelector('#unified_table tbody'),
	tabla: document.getElementById('unified_table'),
	thead: document.querySelector('#unified_table thead'),
	input: document.querySelector('input'),
	filInput: document.querySelector('#fil input'),
	nav: document.getElementById('nav'),
	clr: document.getElementById('clr'),
	msg: document.getElementById('msg'),
	msg2: document.getElementById('msg2'),
	navt: document.getElementById('nav-toggle'),
	upElem: document.getElementById('up'),
	filContainer: document.getElementById('fil')
};
const navtcElements = [elements.navt, elements.nav];
const defaultTerms = [
	{searchTerm: '7"', label: '7" singles/EPs'},
	{searchTerm: '12"', label: '12" singles/EPs'},
	{searchTerm: 'LP', label: 'LPs/Mini LPs'},
	{searchTerm: 'CD', label: 'CDs'},
	{searchTerm: 'Box', label: 'Boxes'},
	{searchTerm: 'DVD', label: 'DVDs'},
	{searchTerm: 'Cassette', label: 'Cassettes'}
];
const addRowsToUnifiedTable = async (url) => {
	const response = await fetch(url);
	const data = await response.text();
	const parser = new DOMParser();
	const doc = parser.parseFromString(data, 'text/html');
	const fragment = document.createDocumentFragment();	
	doc.querySelectorAll('.tablesorter').forEach(table => {
		const section = table.closest('section');
		const isBootleg = url === 'bootlegs.html' || 
					(section && ['Boots_Vin', 'Boots_CD'].includes(section.id));
		table.querySelectorAll('tbody tr').forEach(tr => {
			if (isBootleg) {
				const td = tr.querySelector('td:nth-child(3)');
				const hasContent = td.innerHTML.trim().length > 0;
				td.innerHTML = `${td.innerHTML}${hasContent ? '<w>. </w>' : ''}<span class="b">Bootleg</span>`;
			}
			fragment.appendChild(tr);
		});
	});
	elements.unifiedTbody.appendChild(fragment);
};
Promise.all([
	addRowsToUnifiedTable('singles.html'),
	addRowsToUnifiedTable('LP.html'),
	addRowsToUnifiedTable('CD_singles.html'),
	addRowsToUnifiedTable('CD.html'),
	addRowsToUnifiedTable('cassette.html'),
	addRowsToUnifiedTable('bootlegs.html')
]).then(() => {
	const rows = Array.from(elements.tabla.querySelectorAll('tbody tr'));
	const totalRecords = rows.length;
	new Tablesort(elements.tabla);
	document.querySelectorAll('w').forEach(w => {
		const span = document.createElement('span');
		span.className = 'w';
		span.innerHTML = w.innerHTML;
		w.replaceWith(span);
	});
	rows.forEach((tr, index) => {
		tr.querySelectorAll('td')[1].classList.add('n');
		tr.querySelectorAll('td')[2].classList.add('c');
	});
	if (elements.navt) {
		elements.navt.addEventListener('click', () => 
			navtcElements.forEach(el => el.classList.toggle('collapsed'))
		);
	}
	document.addEventListener('keyup', evt => {
		if (evt.key === 'Escape' && elements.nav.classList.contains('collapsed')) {
			navtcElements.forEach(el => el.classList.toggle('collapsed'));
		}
	});
	const getRecordInfo = () => {
		const counts = defaultTerms.map(({searchTerm, label}) => {
			const count = rows.filter(row => 
				!row.hidden && 
				row.querySelector('td:nth-child(4)').textContent.includes(searchTerm)
			).length;
			return `${label}: <span class="c">${count}</span>`;
		}).join('; ');
		return `(${counts})`;
	};
	elements.msg.innerHTML = `
		Total Records: <span class="bo">${totalRecords}</span> 
		${getRecordInfo()}. The dates of <span class="b">bootlegs</span> are DD/MM/YY.
		Record collection updated March 2025.
	`;
	elements.filInput.addEventListener('keyup', function() {
		const searchTerms = this.value.toLowerCase().split(/\s+/).filter(Boolean);    
		rows.forEach(row => {
			const text = row.textContent.toLowerCase();
			row.hidden = !searchTerms.every(term => text.includes(term));
		});
		const visibleCount = rows.filter(row => !row.hidden).length;
		elements.thead.style.display = visibleCount ? '' : 'none';
		elements.tabla.style.display = visibleCount ? '' : 'none';
		elements.msg2.innerHTML = visibleCount ? 
			`<span class="bo">${visibleCount}</span> record(s) found ${getRecordInfo()}` : 'No records found';
	});
	elements.clr.addEventListener('click', () => {
		elements.filInput.value = '';
		rows.forEach(row => row.hidden = false);
		elements.msg2.innerHTML = '&nbsp;';
		elements.tabla.classList.remove('hidden');
	});
	elements.input.placeholder = `Type here to search in the ${totalRecords} items`;
	[elements.upElem, elements.tabla, elements.filContainer].forEach(el => {if (el) el.style.opacity = '1';});
	document.body.style.cursor = 'default';
});
});
</script>
<div id="up"><a href="#toc">Go Up</a>&nbsp; </div>
</body></html>
