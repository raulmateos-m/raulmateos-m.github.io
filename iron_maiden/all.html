<!DOCTYPE html>
<html lang="en">
<head>
<title>Raul's Iron Maiden Record Collection</title>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="Raul Mateos">
<meta name="keywords" content="iron maiden, record, collection, CD, vinyl, single, LP, bootlegs, EMI, Japan, harris, dickinson, dianno, Discography">
<meta name="description" content="Iron Maiden record collection: Singles, LP, CD, DVD, Bootlegs and so on">
<meta name="robots" content="index, follow">
<meta name="revisit-after" content="1500 days">
<link rel="icon" href="../icons/ironmaiden.ico">
<link rel="stylesheet" href="../styles/raul.css" type="text/css">
<link rel="stylesheet" href="../styles/cookieconsent.css" type="text/css">
<style>.tablesorter, #up, #fil {opacity: 0.1;} .wr {color:#fff; text-align:right;} li#page::after {content:"";}</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tablesort/5.2.1/tablesort.min.js"></script>
</head>
<body>
<header id="toc">
<i id="nav-toggle" title="Menu"></i>
<h1>Iron Maiden Collection</h1>
<nav>
<ul id="nav">
	<li><a href="../all.html">All</a></li>
	<li><a href="../rainbow/all.html">Rainbow</a></li>
	<li id="page">Iron Maiden</li>
	<li><a href="../deep_purple.html">Deep Purple</a></li>
	<li><a href="../black_sabbath.html">Black Sabbath</a></li>
	<li><a href="../dio.html">DIO</a></li>
	<li><a href="../vinyl.html">Vinyl Collection</a></li>
	<li><a href="../CD.html">CD Collection</a></li>
</ul>
</nav>
</header>
<div id="msg">&nbsp;<span id="loading">Loading...</span></div>
<div id="fil"><i class="icon-search"></i><input name="filter" value="" maxlength="30" size="31" type="text"> &nbsp; <button id="clr">Clear search</button></div>
<div id="msg2">&nbsp;</div>
<table id="unified_table" class="tablesorter">
<thead><tr><th>Title</th><th>Country &amp; Year<br><span class="b">Bootlegs</span>: City & Date</th><th>Label &amp; Catalog Number / Comments</th><th>Format</th></tr>
</thead>
<tbody></tbody>
</table>
<script>
document.addEventListener("DOMContentLoaded", function() {
	const unifiedTbody = document.querySelector('#unified_table tbody');
	const tabla = document.getElementById('unified_table');
	const input = document.querySelector('input');
	const filInput = document.querySelector('#fil input');
	const nav = document.getElementById('nav');
	const clr = document.getElementById('clr');
	const msg = document.getElementById('msg');
	const msg2 = document.getElementById('msg2');
	const navt = document.getElementById('nav-toggle');
	const upElem = document.getElementById('up');
	const filContainer = document.getElementById('fil');
	const navtcElements = [navt, nav];
	const defaultTerms = [
		{searchTerm: '7"', label: '7" singles/EPs'},
		{searchTerm: '12"', label: '12" singles/EPs'},
		{searchTerm: 'LP', label: 'LPs/Mini LPs'},
		{searchTerm: 'CD', label: 'CDs'},
		{searchTerm: 'Box', label: 'Boxes'},
		{searchTerm: 'DVD', label: 'DVDs'},
		{searchTerm: 'Cassette', label: 'Cassettes'}
	];
	function addRowsToUnifiedTable(url) {
		return fetch(url)
		.then(response => response.text())
		.then(data => {
			const tempDiv = document.createElement('div');
			tempDiv.innerHTML = data;
			const loadedTables = tempDiv.querySelectorAll('.tablesorter');
			loadedTables.forEach(table => {
				const tbody = table.querySelector('tbody');
				if (tbody) {
					tbody.querySelectorAll('tr').forEach(tr => {
						const filename = url.split('/').pop();
						let addBootlegLabel = false;
						if (filename === 'bootlegs.html') {addBootlegLabel = true;
						} else {
							const section = table.closest('section');
							if (section) {
								const sectionId = section.id;
								if (sectionId === 'Boots_Vin' || sectionId === 'Boots_CD') {addBootlegLabel = true;}
							}
						}
						if (addBootlegLabel) {
							const tds = tr.querySelectorAll('td');
							const td = tds[2];
							let currentContent = td.innerHTML.trim();
							const bootlegSpan = '<span class="b">Bootleg</span>';
							const wSpan = '<w>. </w>';
							if (currentContent === '') {td.innerHTML = bootlegSpan;
							} else if (currentContent.endsWith('</w>')) {
								td.innerHTML = currentContent.replace(/<\/w>$/, '. </w>') + ' ' + bootlegSpan;
							} else {td.innerHTML = currentContent + wSpan + bootlegSpan;}
						}
						unifiedTbody.appendChild(tr);
					});
				}
			});
		});
	}
	Promise.all([
		addRowsToUnifiedTable('singles.html'),
		addRowsToUnifiedTable('LP.html'),
		addRowsToUnifiedTable('CD_singles.html'),
		addRowsToUnifiedTable('CD.html'),
		addRowsToUnifiedTable('cassette.html'),
		addRowsToUnifiedTable('bootlegs.html')
	]).then(() => {
		const totalRows = tabla.querySelectorAll('tbody tr');
		const totalRecords = totalRows.length;
		const tableSorterInstance = new Tablesort(tabla);
		if (navt) {
			navt.addEventListener('click', () => {
				navtcElements.forEach(el => el.classList.toggle('collapsed'));
			});
		}
		document.addEventListener('keyup', evt => {
			if (evt.key === 'Escape' && nav && nav.classList.contains('collapsed')) {
				navtcElements.forEach(el => el.classList.toggle('collapsed'));
			}
		});
		function getRecordInfo(currentTable) {
			const rows = currentTable.querySelectorAll('tbody tr');
			const result = defaultTerms.map(({ searchTerm, label }) => {
				let count = 0;
				rows.forEach(row => {
					if (row.style.display !== 'none') {
						const cells = row.querySelectorAll('td');
							const cellText = cells[3].textContent;
							if (cellText.includes(searchTerm)) {count++;}
					}
				});
				return `${label}: <span class="c">${count}</span>`;
			}).join('; ');
			return `(${result})`;
		}
		if (msg) {
			msg.innerHTML =
				`Total Records: <span class="bo">${totalRecords}</span> ` +
				`${getRecordInfo(tabla)}. The dates of <span class="b">bootlegs</span> are DD/MM/YY.`;
		}
		if (filInput) {
			filInput.addEventListener('keyup', function() {
				const filterValue = this.value.toLowerCase();
				const searchTerms = filterValue.split(' ').filter(term => term !== '');
				const rows = tabla.querySelectorAll('tbody tr');
				rows.forEach(row => {
					const textContent = row.textContent.toLowerCase();
					const allTermsFound = searchTerms.every(term => textContent.includes(term));
					row.style.display = allTermsFound ? '' : 'none';
				});
				const thead = tabla.querySelector('thead');
				if (thead) {thead.style.display = '';}
				tabla.style.display = '';
				const visibleRows = Array.from(rows).filter(row => row.style.display !== 'none');
				const recordInfo = getRecordInfo(tabla);
				const msg2Text = visibleRows.length === 0
					? 'No records found'
					: `<span class="bo">${visibleRows.length}</span> record(s) found ${recordInfo}`;
				if (msg2) {msg2.innerHTML = msg2Text;}
				if (visibleRows.length === 0 && thead) {
					thead.style.display = 'none';
					tabla.style.display = 'none';
				}
			});
		}
		tabla.querySelectorAll('td:nth-child(2)').forEach(td => td.classList.add('n'));
		tabla.querySelectorAll('td:nth-child(3)').forEach(td => td.classList.add('c'));
		tabla.querySelectorAll('tr:nth-child(odd)').forEach(tr => tr.classList.add('even'));
		if (input) {input.setAttribute("placeholder", `Type here to search in the ${totalRows.length} items`);}
		if (clr) {
			clr.addEventListener('click', function() {
				if (input) {
					input.value = '';
					input.focus();
					const event = new KeyboardEvent('keyup', { key: 'Backspace', code: 'Backspace', keyCode: 8, bubbles: true });
					input.dispatchEvent(event);
				}
				if (msg2) msg2.innerHTML = '&nbsp;';
			});
		}
		function replaceElement(selector, className) {
			const elements = document.querySelectorAll(selector);
			elements.forEach(element => {
				const span = document.createElement('span');
				span.className = className;
				span.innerHTML = element.innerHTML;
				if (className === 'c') {span.insertAdjacentText('beforeend', '; ');}
				element.replaceWith(span);
			});
		}
		replaceElement('c', 'c');
		replaceElement('w', 'w');
		if (upElem) {upElem.style.opacity = '1';}
		if (tabla) {tabla.style.opacity = '1';}
		if (filContainer) {filContainer.style.opacity = '1';}
		document.body.style.cursor = 'default';
	});
});
</script>
<div id="up"><a href="#toc">Go Up</a>&nbsp; </div>
</body></html>
