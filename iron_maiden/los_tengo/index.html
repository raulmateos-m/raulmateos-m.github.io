<style>
* {box-sizing: border-box;}
.row {display: flex; clear: both;}
.column {flex: 50%; padding: 10px;}
.zi {cursor: zoom-in;}
.zo {cursor: zoom-out;}
[class*=" om_"] {display: none;}
</style>
<script>
$(document).ready(function(){
	const nombres = [
	"Alexander_the_Great-South_Africa",
	"can_i_uk_WL",
	"flight_icarus_uk_yellow",
	"killers_yugo_yellow",
	"lad_mexico",
	"lad_peru_tengo_los2",
	"mij_spain_cassette",
	"mij_spain_cassette_cut",
	"pom_col_3",
	"pom_peru",
	"pom_venezuela",
	"powerslave_guatemala_court_jester",
	"run_hills_germany",
	"sanctuary_ireland_B",
	"seventh_guatemala_bajo_licencia",
	"seventh_guatemala_con_autorizacion",
	"sit_gua",
	"sit_mex_promo",
	"sit_peru",
	"tnotb_germany_side1",
	"tnotb_gua",
	"tnotb_gua_7",
	"tnotb_yugoslavia_1",
	"tnotb_yugoslavia_2",
	"tnotb_yugoslavia_3",
	"wasted_years_peru_12",
	"wiu_germany_keine_text"
];
	const contenedor = $('.lista');
	nombres.forEach(function(nombre) {
		contenedor.append(`
		<img src="${nombre}.jpg" class="img-responsive img-thumbnail hide_${nombre} om_${nombre} zo">
		<a class="show_${nombre} zi">${nombre}</a><br>
		`);
	});
	const imagesArray = nombres.map(nombre => ({
		img: `${nombre}.jpg`, caption: nombre
	}));
	const fotoramaDiv = $('.fotorama').data('fotorama');
	if (fotoramaDiv) {fotoramaDiv.load(imagesArray);}
	$('a[class^="show_"]').on('click', function(e){
		e.preventDefault();
		const classes = $(this).attr('class').split(' ');
		let identifier = '';
		for (const cls of classes) {
			if (cls.startsWith('show_')) {
				identifier = cls.substring(5);
				break;
			}
		}
		if (identifier) {
				const targetSelector = '.om_' + identifier;
				$(targetSelector).show();
		}
	});
	$(document).on('click', '[class*="hide_"]', function(){
		const classes = $(this).attr('class').split(' ');
		let identifier = '';
		for (const cls of classes) {
			if (cls.startsWith('hide_')) {
				identifier = cls.substring(5);
				break;
			}
		}
		if (identifier) {
			const targetSelector = '.om_' + identifier;
			$(targetSelector).hide();
		}
	});
});
</script>
