<script src="/scripts/fotorama.js"></script>
<script defer src="/scripts/consent-ga.min.js"></script>
<script>
$(document).ready(function(){
	const nombres = [
	"running_free_nz",
	"twilight_zone_france_jukebox2",
	"purgatory_ireland",
	"purgatory_south_africa",
	"tnotb_guatemala_7",
	"flight_of_icarus_france_promo",
	"flight_of_icarus_guatemala",
	"2_minutes_south_africa",
	"run_to_the_hills_black_big_hole",
	"running_free_france_promo_7",
	"running_free_italy_promo_campione_ES",
	"stranger_south_africa",
	"wasted_years_spain_promo_yellow",
	"can_i_spain_promo",
	"wiu_argentina_promo",
	"twilight_zone_12_EEC_right",
	"twilight_zone_12_germany_keine_text",
	"mij_brazil",
	"mij_peru_le_alineado",
	"mij_spain_A_B_sonic_up",
	"aces_high_argentina_promo",
	"running_free_argentina_promo",
	"be_quick_italy_12_promo",
	"im_brazil_BMG-Ariola",
	"im_france_EEC",
	"im_nz_blue",
	"im_spain_estereo_up",
	"im_spain_logo_bigger",
	"killers_germany_promo",
	"killers_spain_fabricsa_sleeve",
	"killers_venezuela_4395",
	"killers_yugoslavia_yellow",
	"tnotb_argentina_promo_emi_left",
	"tnotb_france_holland",
	"tnotb_guatemala_autorzacion_A",
	"tnotb_yugoslavia_other",
	"pom_argentina_56956",
	"pom_australia_otra",
	"pom_france_1077241-BIEM-GEMA",
	"pom_guatemala_EMI_otra",
	"pom_guatemala_con_autorizacion_yellow",
	"pom_venezuela_sin_ruices",
	"powerslave_guatemala_otra",
	"powerslave_guatemala_otra2",
	"powerslave_peru_otra",
	"powerslave_southafrica_otra",
	"lad_ecuador_other",
	"lad_peru",
	"sit_bolivia",
	"sit_brazil_240597_EMI",
	"sit_ecuador_otra",
	"sit_guatemala_capitol_purple",
	"seventh_usa_orange",
	"seventh_usa_promo",	
	"no_prayer_ecuador",
	"no_prayer_spain_promo",
	"fear_of_the_dark_ecuador_promo",
	"wasting_love_no_EMI",
	"early_days_dvd_promo",
	"world_slavery_tengo_el_1"
	];
	const contenedor = $('.lista');
	const imagesArray = nombres.map(nombre => ({img: `${nombre}.jpg`, caption: nombre}));
	const indexMap = {}; 
	nombres.forEach((nombre, index) => {
		indexMap[nombre] = index;
		contenedor.append(`<a href="#" data-nombre="${nombre}" class="lista-link">${nombre}</a><br>`);
	});
	const $fotorama = $('.fotorama');
	$fotorama.fotorama({
		data: imagesArray,
		nav: 'thumbs',
		allowfullscreen: true,
		click: false,
		keyboard: true
	});
	const fotoramaApi = $fotorama.data('fotorama');
	$(document).on('click touchend', '.lista-link', function(e) {
		e.preventDefault();
		const identifier = $(this).data('nombre');
		const index = indexMap[identifier];
		if (fotoramaApi && index !== undefined) {fotoramaApi.show(index);}
	});
	$fotorama.on('fotorama:show', function (e, fotorama, extra) {
		const currentFrameIndex = fotorama.activeIndex;
		const currentName = nombres[currentFrameIndex];
		$('.lista-link').removeClass('activo');
		$(`.lista-link[data-nombre="${currentName}"]`).addClass('activo');
	});
	$fotorama.on('click touchend', '.fotorama__stage__frame', function () {
		if ($fotorama.hasClass('fotorama--fullscreen')) {
			fotoramaApi.cancelFullScreen();
		} else {
			fotoramaApi.requestFullScreen();
		}
	});
	const navToggle = document.getElementById('nav-toggle');
	if (navToggle) {
		navToggle.addEventListener('click', function() {
			document.querySelectorAll("#nav-toggle, #nav, #navb").forEach(el => {el.classList.toggle("collapsed");});
		});
	}
});
</script>
</head>
