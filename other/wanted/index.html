<!DOCTYPE html>
<html lang="en">
<head>
<title>Pictures</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="author" content="Raul Mateos">
<meta name="robots" content="index, follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pavanam:wght@400;700&amp;display=swap">
<link rel="stylesheet" href="/styles/raul.min.css">
<link rel="stylesheet" href="/styles/fotorama.min.css">
<link rel="icon" href="/favicon.ico">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="/scripts/fotorama.js"></script>
<script defer src="/scripts/consent-ga.min.js"></script>
<script>
$(document).ready(function(){
	const nombres = [
	"heaven_and_hell_br_3_big",
	"heaven_and_hell_col_big",
	"heaven_and_hell_greece_back",
	"heaven_and_hell_yug_golden_star_left_big"
	];
	const contenedor = $('.lista');
	const imagesArray = nombres.map(nombre => ({img: `${nombre}.jpg`, caption: nombre}));
	const indexMap = {}; 
	nombres.forEach((nombre, index) => {
		indexMap[nombre] = index;
		contenedor.append(`<a href="#" data-nombre="${nombre}" class="lista-link">${nombre}</a><br>`);
	});
	const $fotorama = $('.fotorama');
	$fotorama.fotorama({
		data: imagesArray,
		nav: 'thumbs',
		allowfullscreen: true,
		click: false
	});
	const fotoramaApi = $fotorama.data('fotorama');
	$(document).on('click', '.lista-link', function(e) {
		e.preventDefault();
		const identifier = $(this).data('nombre');
		const index = indexMap[identifier];
		if (fotoramaApi && index !== undefined) {fotoramaApi.show(index);}
	});
	$fotorama.on('fotorama:show', function (e, fotorama, extra) {
		const currentFrameIndex = fotorama.activeIndex;
		const currentName = nombres[currentFrameIndex];
		$('.lista-link').removeClass('activo');
		$(`.lista-link[data-nombre="${currentName}"]`).addClass('activo');
	});
	$fotorama.on('click', '.fotorama__stage__frame', function () {
		if ($fotorama.hasClass('fotorama--fullscreen')) {
			fotoramaApi.cancelFullScreen();
		} else {
			fotoramaApi.requestFullScreen();
		}
	});
	const navToggle = document.getElementById('nav-toggle');
	navToggle.addEventListener('click', function() {
		document.querySelectorAll("#nav-toggle, #nav").forEach(el => {el.classList.toggle("collapsed");});
	});
});
</script>
<body>
<header id="toc">
<i id="nav-toggle" title="Menu"></i>
<h1>Wanted Vinyl</h1>
<nav>
<ul id="nav">
	<li><a href="/rainbow/all.html">Rainbow</a></li>
	<li><a href="/iron_maiden/all.html">Iron Maiden</a></li>
	<li><a href="/deep_purple.html">Deep Purple</a></li>
	<li><a href="/black_sabbath.html">Black Sabbath</a></li>
	<li><a href="/vinyl.html">Vinyl Collection</a></li>
	<li><a href="/CD.html">CD Collection</a></li>
	<li id="page">Wanted list</li>
	<li><a href="/">All</a></li>
</ul>
</nav>
</header>
<section class='row'>
<div class="lista column"></div>
<div class="fotorama column" data-nav="thumbs"></div>
</section>
</body>
</html>
