<style>
* {box-sizing: border-box;}
.row {display: flex; clear: both;}
.column {flex: 50%; padding: 10px;}
.zi {cursor: zoom-in;}
.zo {cursor: zoom-out;}
[class*=" om_"] {display: none;}
</style>
<script>
$(document).ready(function(){
	const nombres = [
	"fireball_portugal_text",
	"heaven_and_hell_br_3_big",
	"heaven_and_hell_col_big",
	"heaven_and_hell_greece_back",
	"heaven_and_hell_mx_green_big",
	"heaven_and_hell_yug_golden_star_left_big"
];
	const contenedor = $('.lista');
	nombres.forEach(function(nombre) {
		contenedor.append(`
		<img src="${nombre}.jpg" class="img-responsive img-thumbnail hide_${nombre} om_${nombre} zo">
		<a class="show_${nombre} zi">${nombre}</a><br>
		`);
	});
	const imagesArray = nombres.map(nombre => ({
		img: `${nombre}.jpg`, caption: nombre
	}));
	const fotoramaDiv = $('.fotorama').data('fotorama');
	if (fotoramaDiv) {fotoramaDiv.load(imagesArray);}
	$('a[class^="show_"]').on('click', function(e){
		e.preventDefault();
		const classes = $(this).attr('class').split(' ');
		let identifier = '';
		for (const cls of classes) {
			if (cls.startsWith('show_')) {
				identifier = cls.substring(5);
				break;
			}
		}
		if (identifier) {
				const targetSelector = '.om_' + identifier;
				$(targetSelector).show();
		}
	});
	$(document).on('click', '[class*="hide_"]', function(){
		const classes = $(this).attr('class').split(' ');
		let identifier = '';
		for (const cls of classes) {
			if (cls.startsWith('hide_')) {
				identifier = cls.substring(5);
				break;
			}
		}
		if (identifier) {
			const targetSelector = '.om_' + identifier;
			$(targetSelector).hide();
		}
	});
});
</script>
