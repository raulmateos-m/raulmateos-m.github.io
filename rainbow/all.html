<!DOCTYPE html>
<html lang="en">
<head>
<title>ラウル Rainbow / Ritchie Blackmore's Rainbow Record Collection. レインボー</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="author" content="Raul Mateos">
<meta name="keywords" content="rainbow, blackmore, oyster, polydor, records, CD, single, LP, japan">
<meta name="description" content="ritchie blackmore's rainbow record collection: Singles, LP, CD, DVD and Bootlegs">
<meta name="robots" content="index, follow">
<meta name="revisit-after" content="45 days">
<link rel="icon" href="../icons/rainbow.ico">
<link rel="stylesheet" href="../styles/raul.css" type="text/css">
<link rel="stylesheet" href="../styles/cookieconsent.css" type="text/css">
<style>.tablesorter, #up, #fil {opacity: 0.1;} .wr {color:#fff; text-align:right;} li#page::after {content:"";}</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tablesort/5.2.1/tablesort.min.js"></script>
<script src="../scripts/cookieconsent.js"></script>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-5CR6XYZPYE"></script>
<script src="../scripts/g.js"></script>
</head>
<body>
<header id="toc">
<i id="nav-toggle" title="Menu"></i>
<h1>Rainbow Collection</h1>
<nav>
<ul id="nav">
	<li><a href="../all.html">All</a></li>
	<li id="page">Rainbow</li>
	<li><a href="../iron_maiden/all.html">Iron Maiden</a></li>
	<li><a href="../deep_purple.html">Deep Purple</a></li>
	<li><a href="../black_sabbath.html">Black Sabbath</a></li>
	<li><a href="../dio.html">DIO</a></li>
	<li><a href="../vinyl.html">Vinyl Collection</a></li>
	<li><a href="../CD.html">CD Collection</a></li>
</ul>
</nav>
</header>
<div id="msg">&nbsp;<span id="loading">Loading...</span></div>
<div id="fil"><i class="icon-search"></i><input name="filter" value="" maxlength="30" size="31" type="text"> &nbsp; <button id="clr">Clear search</button></div>
<div id="msg2">&nbsp;</div>
<table id="unified_table" class="tablesorter">
<thead><tr><th>Title</th><th>Country & Year<br><span class="b">Bootlegs</span>: City & Date</th><th>Label & Catalog Number / Comments</th><th>Format</th></tr>
</thead>
<tbody></tbody>
</table>
<script>
document.addEventListener("DOMContentLoaded", () => {
const cached = {
	unifiedTbody: document.querySelector('#unified_table tbody'),
	tabla: document.getElementById('unified_table'),
	thead: document.querySelector('#unified_table thead'),
	input: document.querySelector('input'),
	nav: document.getElementById('nav'),
	clr: document.getElementById('clr'),
	msg: document.getElementById('msg'),
	msg2: document.getElementById('msg2'),
	navt: document.getElementById('nav-toggle'),
	up: document.getElementById('up'),
	fil: document.getElementById('fil'),
	rows: null
};
const navtc = [cached.navt, cached.nav];
const defaultTerms = [
	{searchTerm: '7"', label: '7" singles/EPs'},
	{searchTerm: '12"', label: '12" singles/EPs'},
	{searchTerm: 'LP', label: 'LPs/Mini LPs'},
	{searchTerm: 'CD', label: 'CDs'},
	{searchTerm: 'Box', label: 'Boxes'},
	{searchTerm: 'DVD', label: 'DVDs'}
];
const addRowsToUnifiedTable = async (url) => {
	const response = await fetch(url);
	const data = await response.text();
	const parser = new DOMParser();
	const doc = parser.parseFromString(data, 'text/html');
	const fragment = document.createDocumentFragment();	
	doc.querySelectorAll('.tablesorter').forEach(table => {
		const section = table.closest('section');
		const isBootleg = url === 'bootlegs.html' || 
					(section && ['Boots_Vin', 'Boots_CD'].includes(section.id));
		table.querySelectorAll('tbody tr').forEach(tr => {
			if (isBootleg) {
				const td = tr.querySelector('td:nth-child(3)');
				const hasContent = td.innerHTML.trim().length > 0;
				td.innerHTML = `${td.innerHTML}${hasContent ? '<span class="w">. </span>' : ''}<span class="b">Bootleg</span>`;
			}
			fragment.appendChild(tr);
		});
	});
	cached.unifiedTbody.appendChild(fragment);
};
Promise.allSettled([
	addRowsToUnifiedTable('vinyl.html'),
	addRowsToUnifiedTable('CD.html'),
	addRowsToUnifiedTable('bootlegs.html'),
	addRowsToUnifiedTable('others.html')
]).then(() => {
	cached.rows = Array.from(cached.tabla.querySelectorAll('tbody tr'));
	cached.rows.forEach((row) => {
		row._searchText = row.textContent.toLowerCase();
		row._formatCell = row.querySelector('td:nth-child(4)');
	});
	const totalRecords = cached.rows.length;
	new Tablesort(cached.tabla);
	cached.rows.forEach((tr, index) => {
		tr.querySelectorAll('td')[1].classList.add('n');
		tr.querySelectorAll('td')[2].classList.add('c');
	});
	if (cached.navt) {cached.navt.addEventListener('click', () => navtc.forEach(el => el.classList.toggle('collapsed')));}
	document.addEventListener('keyup', evt => {
		if (evt.key === 'Escape' && cached.nav.classList.contains('collapsed')) {
			navtc.forEach(el => el.classList.toggle('collapsed'));
		}
	});
	const getRecordInfo = () => {
		const visibleRows = cached.rows.filter(row => !row.hidden);
		return defaultTerms.map(({searchTerm, label}) => {
			const count = visibleRows.filter(row => row._formatCell.textContent.includes(searchTerm)).length;
			return `${label}: <span class="c">${count}</span>`;
		}).join('; ');
	};
	cached.msg.innerHTML = `Total Records: <span class="bo">${totalRecords}</span> 
		${getRecordInfo()}. The dates on <span class="b">bootlegs</span> use the day/month/year (DD/MM/YY) format.
		Record collection updated May 2025.`;
	const updateUI = () => {
		const visibleCount = cached.rows.filter(row => !row.hidden).length;
		cached.thead.hidden = !visibleCount;
		cached.tabla.hidden = !visibleCount;
		cached.msg2.innerHTML = visibleCount ? 
		`<span class="bo">${visibleCount}</span> record(s) found ${getRecordInfo()}` : 'No records found';
	};
	cached.input.addEventListener('keyup', function() {
		const searchText = this.value.toLowerCase().trim();
		if (!searchText) { cached.rows.forEach(row => row.hidden = false);} 
		else {
			const regex = new RegExp(searchText.split(/\s+/).map(term => `(?=.*${term})`).join(''), 'i');
			cached.rows.forEach(row => {row.hidden = !regex.test(row._searchText);});
		}
		updateUI()
	});
	cached.clr.addEventListener('click', () => {
		cached.input.value = '';
		cached.input.focus();
		cached.rows.forEach(row => row.hidden = false);
		cached.thead.hidden = false;
		cached.tabla.hidden = false;
		updateUI();
		cached.msg2.innerHTML = '&nbsp;';
	});
	cached.input.placeholder = `Type here to search in the ${totalRecords} items`;
	[cached.up, cached.tabla, cached.fil].forEach(el => {if (el) el.style.opacity = '1';})
	document.body.style.cursor = 'default';
});
});
</script>
<div id="up"><a href="#toc">Go Up</a>&nbsp; </div>
</body></html>
