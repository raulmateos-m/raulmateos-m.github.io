<script>
$(document).ready(function(){
	const nombres = [
	"discorama_promo-spain",
	"long_live_rock_n_roll_holland",
	"long_live_rock_n_roll_holland_2",
	"long_live_rock_n_roll_ireland",
	"long_live_rock_n_roll_spain_dist_polydor",
	"long_live_rock_n_roll_usa",
	"long_live_rock_n_roll_usa_22",
	"on_stage_france_no_made_in_france",
	"on_stage_greece",
	"on_stage_holland_stemra",
	"on_stage_spain_1984",
	"on_stage_spain_1990",
	"on_stage_spain_77",
	"on_stage_uk_SIDE_Owl_M",
	"on_stage_uk_SIDE_Owl_M_Ltd",
	"on_stage_uk_SIDE_Owl_M_Ltd_non_separated",
	"on_stage_uk_no_SIDE",
	"on_stage_us_RECORD_right",
	"on_stage_usa_SIDE1_left",
	"on_stage_yugoslavia_polydor_oyster",
	"onstage_s_korea",
	"rbr_australasia",
	"rbr_australia_uk",
	"rbr_canada",
	"rbr_oyster_yugo",
	"rbr_scandinavia_english_1",
	"rbr_scandinavia_english_A",
	"rbr_spain_1984_polygram_27",
	"rbr_uk_polydor_separated",
	"rbr_uk_polydor_together",
	"rbr_uk_polydor_together_no_p",
	"rbr_usa_10019_SM",
	"rbr_usa_PD_right_v2",
	"rbr_usa_RPM",
	"rbr_usa_RPM_53",
	"rbr_usa_mispressed",
	"rbr_west_germany_2929096",
	"rising_canada_MIP_no_1",
	"rising_germany_holland",
	"rising_germany_west_germany_otro",
	"rising_greece_823655-1",
	"rising_holland_2391_224",
	"rising_holland_2482_478",
	"rising_spain_cofasa_bottom",
	"rising_spain_distr_podydor",
	"rising_spain_eurogram",
	"rising_spain_polydor_imp_lujo",
	"rising_spain_polygram_servicios_up",
	"rising_test_pressing_usa",
	"rising_usa_26",
	"rising_usa_SIDE1_and_copyright_left",
	"rising_usa_SIDE1_left",
	"rising_usa_SIDE1_right"
	];
	const contenedor = $('.lista');
	const imagesArray = nombres.map(nombre => ({img: `${nombre}.jpg`, caption: nombre}));
	const indexMap = {}; 
	nombres.forEach((nombre, index) => {
		indexMap[nombre] = index;
		contenedor.append(`<a href="#" data-nombre="${nombre}" class="lista-link">${nombre}</a><br>`);
	});
	const $fotorama = $('.fotorama');
	$fotorama.fotorama({
		data: imagesArray,
		nav: 'thumbs',
		allowfullscreen: true,
		click: false
	});
	const fotoramaApi = $fotorama.data('fotorama');
	$(document).on('click', '.lista-link', function(e) {
		e.preventDefault();
		const identifier = $(this).data('nombre');
		const index = indexMap[identifier];
		if (fotoramaApi && index !== undefined) {fotoramaApi.show(index);}
	});
	$fotorama.on('fotorama:show', function (e, fotorama, extra) {
		const currentFrameIndex = fotorama.activeIndex;
		const currentName = nombres[currentFrameIndex];
		$('.lista-link').removeClass('activo');
		$(`.lista-link[data-nombre="${currentName}"]`).addClass('activo');
	});
	$fotorama.on('click', '.fotorama__stage__frame', function () {
		if ($fotorama.hasClass('fotorama--fullscreen')) {
			fotoramaApi.cancelFullScreen();
		} else {
			fotoramaApi.requestFullScreen();
		}
	});
	const navToggle = document.getElementById('nav-toggle');
	navToggle.addEventListener('click', function() {
		document.querySelectorAll("#nav-toggle, #nav, #navb").forEach(el => {el.classList.toggle("collapsed");});
	});
});
</script>
